<!DOCTYPE html>
<!--
  Fragmentos reutilizables de layout (cabecera, navbar, pie), inspirados en la
  estructura tipica de un theme Bootstrap 5 (ej. los de themewagon.com):
  navbar superior + contenedor con tarjetas/tablas + pie simple.
  Bootstrap se trae por CDN (no requiere build de assets).
  Cada pagina hace th:replace="~{fragments/layout :: head('Titulo')}" etc.
-->
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${titulo} + ' - Sistema Escolar'">Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/custom.css" rel="stylesheet"/>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/alumnos}">Sistema Escolar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/alumnos}">Alumnos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/grados}">Grados</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/aulas}">Aulas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/materias}">Materias</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/notas}">Notas</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/cambiar-password}">Cambiar contrasena</a></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<footer th:fragment="footer" class="text-center text-muted py-4 mt-5 border-top">
    <small>Sistema de Gestion Escolar &mdash; TP Ingenieria del Software II</small>
</footer>
</body>
</html>
