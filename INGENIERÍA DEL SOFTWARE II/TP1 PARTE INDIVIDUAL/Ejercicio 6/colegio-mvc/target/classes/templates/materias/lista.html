<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Materias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Materias</h3>
        <a th:href="@{/materias/nuevo}" class="btn btn-primary">Nueva materia</a>
    </div>
    <div class="card p-3">
        <table class="table table-hover align-middle">
            <thead><tr><th>Nombre</th><th>Carga horaria</th><th>Docente</th><th></th></tr></thead>
            <tbody>
            <tr th:each="m : ${materias}">
                <td th:text="${m.nombre}"></td>
                <td th:text="${m.cargaHorariaSemanal}"></td>
                <td th:text="${m.docenteNombreCompleto} ?: '-'"></td>
                <td class="text-end">
                    <a th:href="@{'/materias/' + ${m.id} + '/editar'}" class="btn btn-sm btn-outline-secondary">Editar</a>
                    <form th:action="@{'/materias/' + ${m.id} + '/eliminar'}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar materia?')">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
