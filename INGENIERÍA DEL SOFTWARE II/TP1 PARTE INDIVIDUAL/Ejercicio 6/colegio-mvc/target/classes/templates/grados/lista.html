<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Grados')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Grados</h3>
        <a th:href="@{/grados/nuevo}" class="btn btn-primary">Nuevo grado</a>
    </div>
    <div class="card p-3">
        <table class="table table-hover align-middle">
            <thead><tr><th>Nombre</th><th>Año lectivo</th><th>Aula</th><th>Alumnos</th><th></th></tr></thead>
            <tbody>
            <tr th:each="g : ${grados}">
                <td th:text="${g.nombre}"></td>
                <td th:text="${g.anioLectivo}"></td>
                <td th:text="${g.aulaNombre} ?: '-'"></td>
                <td th:text="${g.cantidadAlumnos}"></td>
                <td class="text-end">
                    <a th:href="@{'/grados/' + ${g.id} + '/editar'}" class="btn btn-sm btn-outline-secondary">Editar</a>
                    <form th:action="@{'/grados/' + ${g.id} + '/eliminar'}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar grado?')">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
