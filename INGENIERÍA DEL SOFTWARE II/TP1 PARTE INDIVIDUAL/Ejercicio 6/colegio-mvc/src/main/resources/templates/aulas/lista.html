<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Aulas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Aulas</h3>
        <a th:href="@{/aulas/nuevo}" class="btn btn-primary">Nueva aula</a>
    </div>
    <div class="card p-3">
        <table class="table table-hover align-middle">
            <thead><tr><th>Nombre</th><th>Capacidad</th><th></th></tr></thead>
            <tbody>
            <tr th:each="au : ${aulas}">
                <td th:text="${au.nombre}"></td>
                <td th:text="${au.capacidad}"></td>
                <td class="text-end">
                    <form th:action="@{'/aulas/' + ${au.id} + '/eliminar'}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar aula?')">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
