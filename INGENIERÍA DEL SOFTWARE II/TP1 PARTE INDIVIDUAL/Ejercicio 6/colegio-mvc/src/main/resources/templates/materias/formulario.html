<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Materia')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width:560px;">
    <div class="card p-4">
        <h3 class="mb-3">Datos de la materia</h3>
        <form th:action="@{/materias/guardar}" th:object="${materiaDTO}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Carga horaria semanal (hs)</label>
                <input type="number" th:field="*{cargaHorariaSemanal}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Docente</label>
                <select th:field="*{docenteId}" class="form-select">
                    <option value="">-- Sin asignar --</option>
                    <option th:each="d : ${docentes}" th:value="${d.id}"
                            th:text="${d.nombre} + ' ' + ${d.apellido}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/materias}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
