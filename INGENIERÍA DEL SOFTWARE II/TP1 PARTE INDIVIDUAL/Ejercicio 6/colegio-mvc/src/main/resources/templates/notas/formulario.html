<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nota')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width:560px;">
    <div class="card p-4">
        <h3 class="mb-3">Registrar nota</h3>
        <form th:action="@{/notas/guardar}" th:object="${notaDTO}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label class="form-label">Alumno</label>
                <select th:field="*{alumnoId}" class="form-select">
                    <option th:each="a : ${alumnos}" th:value="${a.id}"
                            th:text="${a.nombre} + ' ' + ${a.apellido}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Materia</label>
                <select th:field="*{materiaId}" class="form-select">
                    <option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Nota (1 a 10)</label>
                <input type="number" step="0.1" th:field="*{valor}" class="form-control"/>
                <small class="text-danger" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></small>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" th:field="*{fecha}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Periodo</label>
                <input type="text" th:field="*{periodo}" class="form-control" placeholder="1er cuatrimestre"/>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/notas}" class="btn btn-link">Cancelar</a>
        </form>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
