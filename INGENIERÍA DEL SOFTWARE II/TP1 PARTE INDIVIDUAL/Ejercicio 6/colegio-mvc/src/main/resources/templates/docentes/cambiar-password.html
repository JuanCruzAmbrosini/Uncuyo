<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cambiar contrasena')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container" style="max-width:480px;">
    <div class="card p-4">
        <h3 class="mb-3">Cambiar contrasena</h3>
        <p class="text-success" th:if="${exito}" th:text="${exito}"></p>
        <p class="text-danger" th:if="${errorNegocio}" th:text="${errorNegocio}"></p>
        <form th:action="@{/cambiar-password}" th:object="${cambioPasswordDTO}" method="post">
            <div class="mb-3">
                <label class="form-label">Contrasena actual</label>
                <input type="password" th:field="*{passwordActual}" class="form-control"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Nueva contrasena</label>
                <input type="password" th:field="*{passwordNueva}" class="form-control"/>
                <small class="text-danger" th:if="${#fields.hasErrors('passwordNueva')}" th:errors="*{passwordNueva}"></small>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirmar nueva contrasena</label>
                <input type="password" th:field="*{passwordConfirmacion}" class="form-control"/>
            </div>
            <button type="submit" class="btn btn-primary w-100">Actualizar</button>
        </form>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
