# =========================================================
# Configuracion de la base de datos MySQL (capa ORM/JPA)
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/colegio_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update -> Hibernate crea/actualiza las tablas segun las entidades (comodo para el TP).
# En un ambiente productivo se recomienda usar migraciones versionadas (Flyway/Liquibase) en su lugar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================
# Thymeleaf (capa VISTA de MVC)
# =========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# =========================================================
# Correo saliente (envio de mail de bienvenida al registrar un docente)
# Ejemplo con Gmail SMTP: se recomienda usar una "contraseña de aplicacion",
# nunca la contraseña real de la cuenta.
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu_correo@gmail.com
spring.mail.password=tu_contrasena_de_aplicacion
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=8080
spring.application.name=colegio-mvc
