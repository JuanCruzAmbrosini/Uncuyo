<!DOCTYPE html>
<!--
    Fragmentos reutilizables de la VISTA, adaptados de una plantilla
    Bootstrap 5 (estilo panel administrativo, en la linea de ThemeWagon)
    a las necesidades del proyecto: sidebar de navegacion del dominio
    (Productos, Proveedores, Ordenes de Compra, etc.) + topbar con el
    usuario logueado y logout.

    th:fragment="nombre" define un bloque que otras vistas incluyen con
    th:replace="~{fragments/layout :: nombre}".
-->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <title th:text="${titulo} + ' - TecnoStock'">TecnoStock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
    <!-- Barra lateral con el menu del dominio del negocio -->
    <nav th:fragment="sidebar" class="sidebar p-3">
        <div class="brand mb-4 fs-5"><i class="bi bi-cpu"></i> TecnoStock</div>
        <a th:href="@{/productos}" class="mb-1"><i class="bi bi-box-seam me-2"></i>Productos</a>
        <a href="#" class="mb-1"><i class="bi bi-truck me-2"></i>Proveedores</a>
        <a href="#" class="mb-1"><i class="bi bi-receipt me-2"></i>Ordenes de Compra</a>
        <a href="#" class="mb-1"><i class="bi bi-diagram-3 me-2"></i>Categorias</a>
        <!-- sec:authorize -> etiqueta de thymeleaf-extras-springsecurity6:
             este enlace solo se renderiza si el usuario logueado tiene ROLE_ADMIN -->
        <a href="#" class="mb-1" sec:authorize="hasRole('ADMIN')"><i class="bi bi-people me-2"></i>Usuarios</a>
    </nav>

    <!-- Barra superior con el usuario autenticado y boton de logout -->
    <div th:fragment="topbar(titulo)" class="topbar px-4 py-2 d-flex justify-content-between align-items-center">
        <span class="text-muted" th:text="${titulo}">Titulo</span>
        <span>
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name">usuario</span>
            <a th:href="@{/logout}" class="ms-2 text-muted">Salir</a>
        </span>
    </div>
</body>
</html>
