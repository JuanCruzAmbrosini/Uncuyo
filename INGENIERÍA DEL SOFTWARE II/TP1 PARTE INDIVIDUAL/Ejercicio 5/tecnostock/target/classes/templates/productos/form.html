<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Producto')}"></head>
<body>
<div class="app-layout">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <div class="content">
        <div th:replace="~{fragments/layout :: topbar('Alta / Edicion de Producto')}"></div>

        <div class="p-4">
            <a th:href="@{/productos}" class="btn btn-sm btn-link mb-2 ps-0"><i class="bi bi-arrow-left"></i> Volver al listado</a>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5 class="mb-4" th:text="${productoRequest.idProducto} != null ? 'Editar Producto' : 'Nuevo Producto'">Producto</h5>

                    <!--
                        th:object ata el formulario al DTO "productoRequest" que puso el
                        Controller en el Model. Cada th:field="*{campo}" hace binding
                        bidireccional con esa propiedad del DTO (y precarga su valor
                        en la edicion).
                        La accion cambia entre "guardar" (alta) y "actualizar/{id}"
                        (modificacion) segun si el DTO ya trae idProducto.
                    -->
                    <form th:object="${productoRequest}"
                          th:action="${productoRequest.idProducto} != null
                                     ? @{/productos/actualizar/{id}(id=${productoRequest.idProducto})}
                                     : @{/productos/guardar}"
                          method="post" class="row g-3">

                        <input type="hidden" th:field="*{idProducto}">

                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input th:field="*{nombre}" class="form-control" placeholder="Ej: Notebook Lenovo ThinkPad E14">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Categoria</label>
                            <select th:field="*{idCategoria}" class="form-select">
                                <option value="">Seleccionar...</option>
                                <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('idCategoria')}" th:errors="*{idCategoria}"></div>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Tipo de producto</label>
                            <select th:field="*{tipoProducto}" class="form-select" onchange="toggleTipoProducto(this.value)">
                                <option value="FISICO">Fisico</option>
                                <option value="DIGITAL">Digital</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Precio</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input th:field="*{precio}" type="number" step="0.01" class="form-control">
                            </div>
                            <div class="text-danger small" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Stock actual</label>
                            <input th:field="*{stock}" type="number" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Stock minimo</label>
                            <input th:field="*{stockMinimo}" type="number" class="form-control">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Descripcion</label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
                        </div>

                        <!-- Campos exclusivos de ProductoFisico -->
                        <div id="campos-fisico" class="col-12 border-top pt-3 mt-2">
                            <div class="row g-3">
                                <div class="col-md-4"><label class="form-label">Peso (kg)</label><input th:field="*{peso}" type="number" step="0.01" class="form-control"></div>
                                <div class="col-md-4"><label class="form-label">Dimensiones</label><input th:field="*{dimensiones}" class="form-control"></div>
                                <div class="col-md-4"><label class="form-label">Garantia (meses)</label><input th:field="*{garantiaMeses}" type="number" class="form-control"></div>
                            </div>
                        </div>

                        <!-- Campos exclusivos de ProductoDigital -->
                        <div id="campos-digital" class="col-12 border-top pt-3 mt-2 d-none">
                            <div class="row g-3">
                                <div class="col-md-4"><label class="form-label">Tipo de licencia</label><input th:field="*{tipoLicencia}" class="form-control"></div>
                                <div class="col-md-4"><label class="form-label">URL de descarga</label><input th:field="*{urlDescarga}" class="form-control"></div>
                                <div class="col-md-4"><label class="form-label">Tamaño (MB)</label><input th:field="*{tamañoMB}" type="number" step="0.01" class="form-control"></div>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-accent">Guardar Producto</button>
                            <a th:href="@{/productos}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleTipoProducto(tipo){
        document.getElementById('campos-fisico').classList.toggle('d-none', tipo !== 'FISICO');
        document.getElementById('campos-digital').classList.toggle('d-none', tipo !== 'DIGITAL');
    }
    // Ajusta la visibilidad al cargar la pagina segun el valor actual (util al editar)
    document.addEventListener('DOMContentLoaded', function(){
        var select = document.querySelector('[name="tipoProducto"]');
        if (select) toggleTipoProducto(select.value);
    });
</script>
</body>
</html>
