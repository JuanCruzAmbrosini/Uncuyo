<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<div class="app-layout">
    <nav th:replace="~{fragments/layout :: sidebar}"></nav>

    <div class="content">
        <div th:replace="~{fragments/layout :: topbar('Productos')}"></div>

        <div class="p-4">
            <!-- Mensaje flash luego de un Alta/Modificacion/Baja (patron Post-Redirect-Get) -->
            <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Listado de Productos</h5>
                <a th:href="@{/productos/nuevo}" class="btn btn-accent btn-sm">
                    <i class="bi bi-plus-lg"></i> Nuevo Producto
                </a>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Nombre</th><th>Tipo</th><th>Categoria</th><th>Precio</th><th>Stock</th><th>Estado</th><th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- th:each recorre la lista de ProductoDTO enviada por ProductoController.listar() -->
                        <tr th:each="producto : ${productos}">
                            <td th:text="${producto.nombre}">Nombre</td>
                            <td th:text="${producto.tipoProducto}">FISICO</td>
                            <td th:text="${producto.nombreCategoria}">Categoria</td>
                            <td th:text="${'$ ' + #numbers.formatDecimal(producto.precio, 1, 2)}">$ 0.00</td>
                            <td th:text="${producto.stock}">0</td>
                            <td>
                                <span class="badge badge-stock-low" th:if="${producto.stockBajoMinimo}">Bajo minimo</span>
                                <span class="badge badge-stock-ok" th:unless="${producto.stockBajoMinimo}">Normal</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/productos/editar/{id}(id=${producto.idProducto})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <!-- La baja se hace por POST (no por GET) para evitar borrados accidentales por bots/prefetch -->
                                <form th:action="@{/productos/eliminar/{id}(id=${producto.idProducto})}" method="post" class="d-inline"
                                      onsubmit="return confirm('¿Eliminar este producto?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="7" class="text-center text-muted py-4">No hay productos cargados todavia.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
