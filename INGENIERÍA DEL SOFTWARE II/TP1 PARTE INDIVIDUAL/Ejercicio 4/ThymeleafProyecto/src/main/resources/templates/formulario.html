<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de personas</title>
    <style>
        /* Reseteo básico de márgenes */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Estilo para el fondo de la página */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Centra verticalmente */
            color: #333;
        }

        /* Contenedor principal del formulario */
        .form-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px; /* Ancho máximo para que no se estire demasiado */
        }

        /* Título */
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 600;
        }

        /* Agrupador de cada campo (Label + Input) */
        .form-group {
            margin-bottom: 20px;
        }

        /* Etiquetas */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 14px;
        }

        /* Campos de texto y número */
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        /* Efecto al hacer clic (focus) en los inputs */
        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        /* Botón de enviar */
        button {
            width: 100%;
            padding: 14px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        /* Efecto al pasar el mouse por encima del botón */
        button:hover {
            background-color: #2980b9;
        }

        /* Efecto al hacer clic en el botón */
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Ingreso de Datos</h2>

    <!-- Tu formulario Thymeleaf intacto en su funcionamiento -->
    <form th:action="@{/procesar}" th:object="${persona}" method="post">

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" th:field="*{nombre}" required placeholder="Ej. Juan">
        </div>

        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" th:field="*{apellido}" required placeholder="Ej. Pérez">
        </div>

        <div class="form-group">
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" th:field="*{edad}" required placeholder="Ej. 25">
        </div>

        <button type="submit">Enviar</button>
    </form>
</div>
</body>
</html>
