# =========================================================
# Configuracion de la aplicacion TecnoStock
# =========================================================

spring.application.name=tecnostock
server.port=8080

# --- Conexion a la base de datos MySQL (ORM) ---
# Reemplazar host/puerto/usuario/clave segun el entorno real.
spring.datasource.url=jdbc:mysql://localhost:3306/tecnostock_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate / JPA ---
# ddl-auto=update: Hibernate crea/actualiza automaticamente las tablas
# a partir de las entidades @Entity (util para el TP; en produccion se
# reemplazaria por migraciones versionadas con Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Thymeleaf (Vista) ---
# cache=false para ver los cambios en las plantillas sin reiniciar el server (solo en desarrollo)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
